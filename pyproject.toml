[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reusable-agent-harness"
version = "0.1.0"
description = "A reusable Python framework for building AI agents"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "python-dotenv",
    "pydantic",
]

[tool.setuptools.packages.find]
include = ["agent_core*"]